<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%234369e7'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-size='26' fill='white'%3E约%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="约定合同阅读器：读懂约定，再做决定。导入材料、阅读提问、确认协商三步交互原型。" />
    <title>约定 · 读懂约定，再做决定</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 后端地址解析（优先级从高到低）：
      //   1. ?backend=https://… 查询参数 —— 公网演示（如 CF Tunnel）时直接在 URL 里指定后端
      //   2. window.YUEDING_BACKEND_CONFIG.baseUrl —— 部署时在 HTML 里预写
      //   3. localhost/127.0.0.1 自动指向 http://127.0.0.1:8000
      //   4. 其他域名默认 ''（纯本地模式，不发任何请求）
      (function () {
        var qs = new URLSearchParams(location.search)
        var fromQuery = qs.get('backend')
        var isLocal = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
        var preset = window.YUEDING_BACKEND_CONFIG || {}
        window.YUEDING_BACKEND_CONFIG = Object.assign(
          { baseUrl: isLocal ? 'http://127.0.0.1:8000' : '', timeout: 60000 },
          preset,
          fromQuery ? { baseUrl: fromQuery.replace(/\/$/, '') } : {}
        )
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

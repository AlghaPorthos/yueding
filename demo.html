<style>

ns:repeat(3,1fr);gap:10px;margin-bottom:14px}.tab{border:1px solid var(--line);border-radius:10px;background:white;text-align:left;padding:13px 17px;color:var(--ink)}.tab:hover{border-color:#a8bbe7}.tab[aria-selected=true]{background:#283b59;color:white;border-color:#283b59}.tab strong,.tab small{display:block}.tab strong{font-size:15px}.tab small{font-size:11px;color:var(--muted)}.tab[aria-selected=true] small{color:#b4c4db}.layout{display:grid;grid-template-columns:.95fr 1.05fr;gap:14px}.panel{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 4px 15px #20325708}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}.pill{padding:3px 7px;border-radius:5px;background:#edf3ff;color:#4c6eaf;font-size:10px}.paper{background:#fffefa;min-height:351px;padding:20px 23px}.paper h3{text-align:center;font-family:serif;font-size:21px;margin:0 0 3px}.paper .subtitle{text-align:center;color:#9b9b98;font-size:11px;margin-bottom:16px}.clause{font-family:"Songti SC",SimSun,serif;font-size:13px;line-height:1.9;padding:10px 0;border-top:1px solid #e9e7e0}.clause mark{background:#ffebb7;color:inherit}.goal{padding:13px 18px;background:#eaf0ff;border-top:1px solid #dce6fa;font-size:13px}.goal b{color:var(--blue);margin-right:8px}.results{padding:17px}.lead{padding:12px 14px;border-left:4px solid #e6a741;background:#fff7e8;margin-bottom:12px;border-radius:0 8px 8px 0}.lead strong{font-size:17px}.lead p{margin:2px 0 0;font-size:12px;color:#82693e}.cards{display:grid;gap:9px}.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px}.card small{display:block;color:#5272ab;font-size:10px;font-weight:800;letter-spacing:.1em}.card strong{display:block;font-size:13px;margin-top:2px}.card p{color:#607088;font-size:11px;margin:3px 0 0}.card cite{display:inline-block;background:#ebf2ff;color:#4968ac;font-style:normal;font-size:10px;border-radius:4px;padding:2px 6px;margin-top:6px}.card.action{background:#f4fbf8;border-color:#cae4d8}.card.action small{color:#18816c}.card.action cite{background:#ddf3e9;color:#177965}.flow{margin:14px 0;background:var(--navy);color:#fff;border-radius:13px;padding:18px 21px}.flow-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.flow h3{font-size:15px;margin:0}.flow-head p{font-size:11px;color:#acbed7;margin:0}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.step{border:1px solid #ffffff31;border-radius:8px;padding:10px 12px;background:#ffffff0a}.step b{display:block;color:var(--gold);font-size:10px}.step strong{display:block;font-size:12px}.step p{font-size:10px;color:#b9c8dd;line-height:1.45;margin:2px 0 0}.launch{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#eaf0ff;border:1px solid #c7d7f5;border-radius:12px;padding:16px 19px;margin-bottom:34px}.launch strong{font-size:14px}.launch p{font-size:11px;color:#64769a;margin:2px 0 0;max-width:740px}.launch a{background:var(--blue);color:white;border-radius:7px;white-space:nowrap;padding:10px 16px;font-size:12px;font-weight:800}.launch a:hover{background:#294fc5}.footer{border-top:1px solid var(--line);padding:18px 0 26px;display:flex;justify-content:space-between;gap:15px;font-size:11px;color:#8995a6}.footer a{color:var(--blue);font-weight:750}@media(max-width:800px){.hero,.layout{grid-template-columns:1fr}.stats{max-width:550px}.paper{min-height:0}}@media(max-width:600px){.wrap{padding:0 16px}.hero{padding:29px 0;gap:20px}.intro{align-items:flex-start;flex-direction:column;gap:7px}.tabs{gap:5px}.tab{padding:9px}.tab strong{font-size:12px}.tab small{font-size:9px}.steps{grid-template-columns:repeat(2,1fr)}.flow-head{display:block}.launch{flex-direction:column;align-items:stretch}.launch a{text-align:center}.footer{flex-direction:column;gap:4px}.stats b{font-size:20px}.stats span{font-size:9px}}
@media(max-width:600px){.nav .overline{display:none}.logo{white-space:nowrap}.back{white-space:nowrap}.nav{gap:10px}}

<body>
<div class="dark"><div class="wrap"><nav class="nav" aria-label="演示页导航"><a class="logo" href="index.html"><span class="mark">约</span>约定</a><span class="overline">INTERACTIVE DEMO</span><a class="back" href="index.html">返回产品首页 ↗</a></nav><div class="hero"><div><div class="overline">HACKATHON DEMO · 三个真实工作流</div><h1>签字之前，<br><em>把话说清楚。</em></h1><p>合同不只是一页摘要。选一个场景，看「约定」如何把原文变成可核对的依据、待确认的问题和下一步行动。</p></div><div class="stats"><div><b>03</b><span>高频场景</span></div><div><b>02</b><span>分析与复核阶段</span></div><div><b>01</b><span>可执行行动卡</span></div></div></div></div></div>
<main class="wrap"><div class="intro"><div><h2>选择一个约定</h2><p>虚构材料与示例输出用于讲解；实际运行请打开对应的 Dify 工作流。</p></div><span class="badge">虚构样例 · 非实时分析</span></div><div class="tabs" role="tablist" aria-label="演示场景"><button type="button" role="tab" class="tab" id="tab-rental" aria-controls="demo-panel" aria-selected="true" tabindex="0" data-key="rental"><strong>01 · 租房打孔</strong><small>能装书架吗？押金会怎样？</small></button><button type="button" role="tab" class="tab" id="tab-employment" aria-controls="demo-panel" aria-selected="false" tabindex="-1" data-key="employment"><strong>02 · 入职签约</strong><small>80 万总包写清楚了吗？</small></button><button type="button" role="tab" class="tab" id="tab-privacy" aria-controls="demo-panel" aria-selected="false" tabindex="-1" data-key="privacy"><strong>03 · 应用授权</strong><small>通讯录权限真的必要吗？</small></button></div><div id="demo-panel" role="tabpanel" aria-labelledby="tab-rental"></div></main>
<footer class="wrap footer"><span>约定 · 签字之前，把话说清楚。示例均为虚构，结果需结合实际文件复核。</span><a href="index.html">返回产品首页 ↗</a></footer>
<script>
const cases={
rental:{title:'租房打孔',document:'房屋租赁合同',subtitle:'第六条 房屋使用与退租验收',clauses:['<b>6.3</b> 未经出租人<mark>书面同意</mark>，承租人不得在墙面打孔、打钉或改变房屋结构。','<b>6.4</b> 退租时，承租人应将房屋恢复至<mark>甲方认可的状态</mark>；修复费用可从押金中扣除。','<b>附件 3</b> 退租清洁服务费每间 120 元。'],goal:'我想装书架，明年退租时避免押金争议。',decision:'先不要打孔',reason:'先取得书面同意，确认施工位置与退租验收标准。',cards:[['合同依据','书面同意是施工前提','“甲方认可的状态”缺少可操作的验收标准。','第 6.3、6.4 条'],['待确认','哪些墙可施工？如何修复与验收？','入住和施工前拍照，并保存双方确认记录。',''],['可编辑消息草稿','“我想在这面墙打两个孔安装书架。能否先确认位置，并约定退租时的修复和验收标准？”','','由用户修改后自行发送']],steps:[['提取租约','识别正文、附件、用户目标'],['定位条款','找限制、费用与模糊表述'],['检查依据','核对引文，分开事实与推断'],['生成选择','提出问题、证据清单与草稿']],url:'https://udify.app/workflow/ruuUvJWryY8SboIS',button:'打开租房工作流',tip:'此页面不会传送任何材料；只有在 Dify 页面主动上传的文件才会进入云端工作流。'},
employment:{title:'入职签约',document:'录用通知书',subtitle:'薪酬与激励安排',clauses:['<b>固定薪酬</b> 税前年基本工资人民币 48 万元。','<b>绩效奖金</b> 根据公司考核结果及届时适用的奖金政策确定；<mark>具体发放时间另行通知</mark>。','<b>长期激励</b> 期权授予条件、归属安排和离职处理以<mark>另行签署的文件</mark>为准。'],goal:'HR 口头说“总包 80 万”；我更在意收入确定性。',decision:'先确认 80 万的构成',reason:'书面文件只明确了 48 万固定薪酬，其余部分的条件尚不完整。',cards:[['已经写明','固定薪酬：税前 48 万元/年','奖金和期权不能直接当作已确定收入。','录用通知书 · 薪酬条款'],['待确认','奖金何时发？期权何时归属？','索取考核规则、授予文件、归属与离职处理规则。',''],['可编辑沟通方案','“能否把总包构成逐项列明，并明确奖金考核与支付时间？我希望优先提高固定薪酬的确定性。”','','由用户修改后自行发送']],steps:[['汇总材料','录用通知、合同、HR 说法'],['拆分薪酬','固定、奖金、期权逐项核对'],['标记缺口','检查金额、条件、时间与来源'],['生成问题','按用户偏好准备沟通方案']],url:'https://udify.app/workflow/tI2nxuqPTklugoKl',button:'打开入职工作流',tip:'可填写招聘方的口头说法和谈判优先级。此页面不会自动上传材料。'},
privacy:{title:'应用授权',document:'隐私政策',subtitle:'信息收集与权限使用',clauses:['<b>2.1</b> 为提供附近内容推荐，我们可能收集设备位置信息。','<b>2.2</b> 为便于好友发现，应用可能请求访问<mark>通讯录</mark>。','<b>2.3</b> 应用可在用户拍摄或上传内容时请求相机权限。<mark>本节未说明拒绝通讯录权限后的功能影响。</mark>'],goal:'我只想看内容，不打算找好友或发布照片。',decision:'按使用目的决定授权',reason:'对于当前目标，通讯录和相机都无需预先开放。',cards:[['协议写明','位置 → 附近推荐；通讯录 → 好友发现','协议没有解释拒绝通讯录权限后是否仍可浏览内容。','隐私政策 · 第 2.1–2.3 条'],['待确认','是否可不授权通讯录继续使用？','也要核对数据共享、保留期限与系统实际权限请求。',''],['可执行选择','先拒绝通讯录；需要拍照时再决定是否开放相机；位置按设备提供的选项授权。','','用户在设备上自行设置']],steps:[['读取协议','隐私政策、权限请求、目的'],['核对用途','收集什么、为何、与谁共享'],['标记缺口','找未说明的影响与条件'],['给出步骤','按当前目标安排授权时机']],url:'https://udify.app/workflow/xTDGTuzyGf0M9o3R',button:'打开权限工作流',tip:'可填写应用请求的权限与自己的使用目的。此页面不会更改设备设置。'}};
const tabs=[...document.querySelectorAll('[role="tab"]')];
function show(key,focus=false){const data=cases[key];if(!data)return;for(const tab of tabs){const active=tab.dataset.key===key;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1}const active=document.getElementById('tab-'+key);document.getElementById('demo-panel').setAttribute('aria-labelledby',active.id);document.getElementById('demo-panel').innerHTML=`<div class="layout"><section class="panel" aria-label="虚构合同材料"><div class="panel-head">输入材料 · ${data.document}<span class="pill">虚构节选</span></div><div class="paper"><h3>${data.document}</h3><div class="subtitle">${data.subtitle}</div>${data.clauses.map(x=>`<div class="clause">${x}</div>`).join('')}</div><div class="goal"><b>用户目标</b>${data.goal}</div></section><section class="panel" aria-label="示例行动卡"><div class="panel-head">输出 · 可以立即使用的行动卡<span class="pill">依据可追溯</span></div><div class="results"><div class="lead"><strong>${data.decision}</strong><p>${data.reason}</p></div><div class="cards">${data.cards.map((x,i)=>`<div class="card${i===2?' action':''}"><small>${x[0]}</small><strong>${x[1]}</strong>${x[2]?`<p>${x[2]}</p>`:''}${x[3]?`<cite>${x[3]}</cite>`:''}</div>`).join('')}</div></div></section></div><section class="flow"><div class="flow-head"><h3>Agentic workflow · 从原文到行动</h3><p>分析与依据复核分阶段进行，保留待确认事项</p></div><div class="steps">${data.steps.map((x,i)=>`<div class="step"><b>0${i+1}</b><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join('')}</div></section><section class="launch"><div><strong>运行「${data.title}」真实工作流</strong><p>${data.tip}</p></div><a href="${data.url}" target="_blank" rel="noopener noreferrer">${data.button} ↗</a></section>`;if(focus)active.focus();history.replaceState(null,'','#'+key)}
tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>show(tab.dataset.key));tab.addEventListener('keydown',event=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(event.key))return;event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(i+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;show(tabs[next].dataset.key,true)})});show(cases[location.hash.slice(1)]?location.hash.slice(1):'rental');window.addEventListener('hashchange',()=>{const key=location.hash.slice(1);if(cases[key])show(key)});
</script>
</body>
</html>
